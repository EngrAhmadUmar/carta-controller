apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carta-controller
  namespace: carta
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  rules:
  - host: carta.local  # Change this to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: carta-controller
            port:
              number: 3003
  tls:
  - hosts:
    - carta.local  # Change this to your domain
    secretName: carta-tls 