apiVersion: v1
kind: ConfigMap
metadata:
  name: carta-config
  namespace: carta
data:
  NODE_ENV: "production"
  MONGODB_URI: "mongodb://mongodb.carta.svc.cluster.local:27017"
  MONGODB_DATABASE: "carta"
  CARTA_SERVER_PORT: "3003"
  CARTA_SERVER_INTERFACE: "0.0.0.0"
  CARTA_SAMPLE_FILES_PATH: "/home/carta/carta-controller-new/data/shared_test_files"
  config.json: |
    {
      "$schema": "./config_schema.json",
      "authProviders": {
        "ldap": {
          "publicKeyLocation": "/etc/carta/carta_public.pem",
          "privateKeyLocation": "/etc/carta/carta_private.pem",
          "issuer": "carta.local",
          "keyAlgorithm": "RS256",
          "accessTokenAge": "15m",
          "refreshTokenAge": "1w",
          "ldapOptions": {
            "url": "ldap://openldap.carta.svc.cluster.local:389",
            "searchBase": "ou=users,dc=nodomain",
            "searchFilter": "uid={{username}}",
            "starttls": false,
            "reconnect": true,
            "bindProperty": "dn",
            "searchScope": "sub",
            "strictDN": true
          }
        }
      },
      "database": {
        "uri": "mongodb://mongodb.carta.svc.cluster.local:27017",
        "databaseName": "carta"
      },
      "serverPort": 3003,
      "serverInterface": "0.0.0.0",
      "serverAddress": "http://carta.local:30004",
      "apiAddress": "/api",
      "processCommand": "/usr/local/bin/carta_backend",
      "killCommand": "/usr/bin/kill_carta_backend",
      "rootFolderTemplate": "/home/carta/carta-controller-new/data/shared_test_files",
      "baseFolderTemplate": "/home/carta/carta-controller-new/data/shared_test_files",
      "logFileTemplate": "/home/carta/.carta/log/carta.log",
      "additionalArgs": ["--no_frontend", "--no_database"],
      "preserveEnv": true,
      "dashboard": {
        "bannerColor": "#d2dce5",
        "backgroundColor": "#f6f8fa",
        "bannerImage": "./public/images/carta_logo.svg",
        "infoText": "Welcome to the CARTA server.",
        "loginText": "<span>Please enter your login credentials:</span>",
        "footerText": "<span>If you have any problems, comments or suggestions, please contact the system administrator.</span>"
      }
    }
  kill_carta_backend: |
    #!/bin/bash
    pkill -f carta_backend
    pkill -f node
    pkill -f ts-node
    exit 0 