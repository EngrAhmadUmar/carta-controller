apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: carta-data-pvc
  namespace: carta
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: carta-logs-pvc
  namespace: carta
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: carta-mongodb-data
  namespace: carta
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi 